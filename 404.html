<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đang chuyển hướng bản sao...</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f8fafc;
      color: #334155;
    }
    .loading-box {
      text-align: center;
      padding: 30px 40px;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      max-width: 420px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #e0f2fe;
      border-top-color: #0284c7;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h3 { margin: 0 0 8px 0; color: #0f172a; font-size: 16px; }
    p { margin: 0; color: #64748b; font-size: 13px; line-height: 1.5; }
  </style>
  <script>
    // GitHub Pages SPA Redirector
    // Nhận diện đường dẫn rút gọn dạng https://leevu221-lang.github.io/tracuuphieumuahang/<slug>
    (function() {
      var pathname = window.location.pathname;
      var repoPrefix = '/tracuuphieumuahang';
      
      var cleanPath = pathname;
      if (cleanPath.indexOf(repoPrefix) === 0) {
        cleanPath = cleanPath.substring(repoPrefix.length);
      }
      
      cleanPath = cleanPath.replace(/^\/+|\/+$/g, '');
      var segments = cleanPath.split('/').filter(Boolean);
      
      if (segments.length > 0 && segments[0] !== 'index.html') {
        var slug = segments[0];
        var targetUrl = repoPrefix + '/?s=' + encodeURIComponent(slug);
        if (window.location.search) {
          targetUrl += '&' + window.location.search.replace(/^\?/, '');
        }
        if (window.location.hash) {
          targetUrl += window.location.hash;
        }
        window.location.replace(targetUrl);
      } else {
        window.location.replace(repoPrefix + '/');
      }
    })();
  </script>
</head>
<body>
  <div class="loading-box">
    <div class="spinner"></div>
    <h3>Đang Tải Bản Sao Ứng Dụng...</h3>
    <p>Vui lòng chờ trong giây lát, hệ thống đang kết nối dữ liệu bản sao.</p>
  </div>
</body>
</html>
